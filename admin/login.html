<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelley Admin — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Della+Respira&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-milk: #FDF5E6;
      --color-milk-dark: #F5EBD7;
      --color-black: #121212;
      --color-gray: #757575;
      --font-family: 'Della Respira', Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background-color: var(--color-milk);
      color: var(--color-black);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      letter-spacing: 0.02em;
    }
    .login-box {
      background: var(--color-milk-dark);
      padding: 60px 48px;
      border: 1px solid rgba(0,0,0,0.08);
      width: 100%;
      max-width: 460px;
      text-align: center;
    }
    .login-box h1 {
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .login-box p {
      color: var(--color-gray);
      font-size: 0.9rem;
      margin-bottom: 40px;
    }
    .field {
      margin-bottom: 24px;
      text-align: left;
    }
    .field label {
      display: block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }
    .field input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(0,0,0,0.15);
      background: var(--color-milk);
      font-family: var(--font-family);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus { border-color: var(--color-black); }
    .btn-login {
      width: 100%;
      padding: 16px;
      background: var(--color-black);
      color: var(--color-milk);
      border: none;
      font-family: var(--font-family);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: opacity 0.3s;
      margin-top: 12px;
    }
    .btn-login:hover { opacity: 0.85; }
    .error-msg {
      color: #b45309;
      font-size: 0.85rem;
      margin-top: 16px;
      display: none;
    }
    .back-link {
      display: block;
      margin-top: 32px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .back-link a {
      color: var(--color-gray);
      text-decoration: none;
      transition: color 0.3s;
    }
    .back-link a:hover { color: var(--color-black); }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Shelley Admin</h1>
    <p>Sanctuary Management</p>
    
    <div class="field">
      <label for="password">Admin Password</label>
      <input type="password" id="password" placeholder="Enter password" autofocus>
    </div>
    
    <button class="btn-login" id="login-btn">Enter Portal</button>
    <p class="error-msg" id="error-msg">Incorrect password. Please try again.</p>
    
    <p class="back-link"><a href="../index.html">← Return to Sanctuary</a></p>
  </div>

  <script>
    const btn = document.getElementById('login-btn');
    const errorMsg = document.getElementById('error-msg');

    btn.addEventListener('click', login);
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const pw = document.getElementById('password').value.trim();
      if (!pw) return;
      btn.textContent = 'Authenticating…';
      btn.disabled = true;
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('../api/auth.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('shelley_admin_token', data.data.token);
          window.location.href = 'index.html';
        } else {
          throw new Error(data.error || 'Login failed');
        }
      } catch (err) {
        errorMsg.style.display = 'block';
        btn.textContent = 'Enter Portal';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
